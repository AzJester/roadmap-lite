name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0) — creates tag v<version> and publishes RoadmapBuilder.html"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: "true"

  release:
    # Publish RoadmapBuilder.html as a one-file download on the Releases
    # page: push a v* tag, or run this workflow manually with a version
    # number (the release then creates the tag itself).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with the standalone file
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="v${INPUT_VERSION}"; fi
          gh release create "${TAG}" RoadmapBuilder.html \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Roadmap Builder Lite ${TAG}" \
            --notes "Download RoadmapBuilder.html and double-click it. No install, no account, no network."
